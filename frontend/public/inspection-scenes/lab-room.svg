  <circle cx="450" cy="176" r="4" fill="#44f0a3" opacity="0.7"/>
  <circle cx="470" cy="176" r="4" fill="#44f0a3" opacity="0.4"/>
  <circle cx="450" cy="234" r="4" fill="#44f0a3" opacity="0.5"/>
